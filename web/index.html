<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☁️ CloudLTE AI 聊天终端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f1117; color:#e8eaf0; height:100vh; display:flex; flex-direction:column; }
/* 顶部 */
.header { background:#1a1d27; padding:12px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #2a2e3a; }
.header h1 { font-size:16px; font-weight:600; color:#7cc4ff; }
.header .badge { background:#2a3a4a; color:#7cc4ff; padding:2px 10px; border-radius:10px; font-size:11px; }
.header .status { margin-left:auto; font-size:11px; color:#8b93a7; }
.header .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; margin-right:5px; }
/* 聊天区 */
.chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
.msg { max-width:75%; padding:12px 16px; border-radius:12px; line-height:1.6; font-size:14px; word-wrap:break-word; }
.msg.user { align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:#232735; border-bottom-left-radius:4px; }
.msg.error { background:#3a1d24; color:#ff8f8f; }
.msg .time { display:block; font-size:10px; color:#8b93a7; margin-top:6px; }
.typing { align-self:flex-start; background:#232735; padding:12px 16px; border-radius:12px; font-size:13px; color:#8b93a7; }
.typing span { animation: blink 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:0.2s } .typing span:nth-child(3){ animation-delay:0.4s }
@keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }
/* 输入区 */
.input-area { padding:14px 20px; background:#1a1d27; border-top:1px solid #2a2e3a; display:flex; gap:10px; }
.input-area textarea { flex:1; background:#232735; border:1px solid #2a2e3a; color:#e8eaf0; border-radius:10px; padding:12px; font-size:14px; resize:none; outline:none; max-height:120px; }
.input-area textarea:focus { border-color:#2563eb; }
.input-area button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:0 22px; font-size:14px; cursor:pointer; }
.input-area button:hover { background:#1d4ed8; }
.input-area button:disabled { background:#3a4160; cursor:not-allowed; }
/* 设置 */
.settings { position:fixed; right:20px; bottom:80px; background:#1a1d27; border:1px solid #2a2e3a; border-radius:12px; padding:16px; width:300px; display:none; gap:10px; flex-direction:column; z-index:10; }
.settings.show { display:flex; }
.settings input, .settings select { background:#232735; border:1px solid #2a2e3a; color:#e8eaf0; border-radius:8px; padding:8px 10px; font-size:13px; outline:none; }
.settings label { font-size:12px; color:#8b93a7; }
.settings button { background:#2563eb; color:#fff; border:none; border-radius:8px; padding:8px; cursor:pointer; }
.gear { position:fixed; right:20px; bottom:70px; width:36px; height:36px; border-radius:50%; background:#232735; border:1px solid #2a2e3a; color:#8b93a7; cursor:pointer; z-index:11; }
</style>
</head>
<body>
<div class="header">
  <h1>☁️ CloudLTE AI</h1>
  <span class="badge">DeepSeek</span>
  <span class="status"><span class="dot"></span><span id="apiStatus">内网模式</span></span>
</div>

<div class="chat" id="chat">
  <div class="msg bot">你好！我是运行在骁龙 410 上的 AI 聊天终端 🚀<br>输入消息开始对话（回车发送，Shift+回车换行）</div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="输入消息... (Enter 发送)"></textarea>
  <button id="sendBtn">发送</button>
</div>

<button class="gear" onclick="toggleSettings()">⚙️</button>
<div class="settings" id="settings">
  <label>API 地址</label>
  <input id="setApi" value="https://api.deepseek.com/v1">
  <label>API Key</label>
  <input id="setKey" type="password" placeholder="sk-...">
  <label>模型</label>
  <input id="setModel" value="deepseek-chat">
  <label>系统提示词</label>
  <textarea id="setSystem" rows="2" style="background:#232735;border:1px solid #2a2e3a;color:#e8eaf0;border-radius:8px;padding:8px;font-size:13px;outline:none;">你是 CloudLTE AI 助手</textarea>
  <button onclick="saveSettings()">保存</button>
</div>

<script>
// ===== 配置 (localStorage 持久化) =====
const CFG = {
  api: localStorage.getItem('cl_api') || 'https://api.deepseek.com/v1',
  key: localStorage.getItem('cl_key') || '',
  model: localStorage.getItem('cl_model') || 'deepseek-chat',
  system: localStorage.getItem('cl_system') || '你是 CloudLTE AI 助手',
};
const history = [];

function saveSettings() {
  CFG.api = document.getElementById('setApi').value.trim();
  CFG.key = document.getElementById('setKey').value.trim();
  CFG.model = document.getElementById('setModel').value.trim();
  CFG.system = document.getElementById('setSystem').value.trim();
  Object.entries(CFG).forEach(([k,v]) => localStorage.setItem('cl_'+k, v));
  document.getElementById('settings').classList.remove('show');
  document.getElementById('apiStatus').textContent = CFG.key ? '已配置' : '未配置 Key';
  addMsg('bot', '✅ 配置已保存');
}
function toggleSettings() { document.getElementById('settings').classList.toggle('show'); }

// ===== 界面 =====
function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  div.appendChild(time);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function showTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '思考中<span>.</span><span>.</span><span>.</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

// ===== DeepSeek API 直连 =====
async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (!CFG.key) { addMsg('error', '⚠️ 请先点右上角 ⚙️ 配置 API Key'); return; }

  input.value = '';
  addMsg('user', text);
  history.push({role:'user', content:text});
  showTyping();
  document.getElementById('sendBtn').disabled = true;

  try {
    const resp = await fetch(CFG.api.replace(/\/+$/,'') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+CFG.key },
      body: JSON.stringify({
        model: CFG.model,
        messages: [{role:'system',content:CFG.system}, ...history.slice(-20)],
        max_tokens: 2000,
        stream: false,
      })
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error('HTTP '+resp.status+': '+err.slice(0,150));
    }
    const data = await resp.json();
    const reply = data.choices[0].message.content;
    hideTyping();
    addMsg('bot', reply);
    history.push({role:'assistant', content:reply});
    if (history.length > 50) history.splice(0, history.length-50);
  } catch (e) {
    hideTyping();
    addMsg('error', '❌ 请求失败: '+e.message);
  }
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('input').focus();
}

// ===== 事件 =====
document.getElementById('sendBtn').onclick = send;
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('apiStatus').textContent = CFG.key ? '已配置' : '未配置 Key';
</script>
</body>
</html>
